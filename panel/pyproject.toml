[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visibility-panel"
version = "0.1.0"
description = "Local visibility engine testing panel"
requires-python = ">=3.12"
dependencies = ["visibility-runner==0.2.80", "workspace-automation-core==0.1.3", "workspace-platform-runtime==0.1.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
visibility-panel = "visibility_panel.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"visibility_panel.web" = ["templates/*.html", "static/*.css", "static/*.js"]
