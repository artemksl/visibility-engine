[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axbridge"
version = "0.2.4"
description = "Shared verified desktop motion and macOS accessibility reader for Chrome"
requires-python = ">=3.11"
dependencies = [
    "atomacos==3.3.0; sys_platform == 'darwin'",
    "PyAutoGUI==0.9.41; sys_platform == 'darwin'",
    "workspace-platform-runtime[desktop]==0.1.0",
]

[project.scripts]
axbridge = "axbridge.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["axbridge*"]

[project.optional-dependencies]
plots = ["matplotlib>=3.9"]
