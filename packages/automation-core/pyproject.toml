[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-automation-core"
version = "0.1.2"
description = "Shared browser automation, workflow storage and diagnostics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["playwright>=1.40,<2"]

[project.optional-dependencies]
assets = ["Pillow>=10,<13"]
test = ["pytest>=8,<10"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["automation_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
